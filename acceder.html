<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Les K-Chroniques de Léona — Accès</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="assets/icons/favicon-32.png" />
  <meta name="theme-color" content="#c1502b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <main class="fds-login-wrap">
    <form class="fds-login-card" id="login-form">
      <h1 style="font-size:22px; margin-bottom:6px;">Les K-Chroniques de Léona</h1>
      <p style="font-size:13px; color:var(--ink-soft); margin-bottom:20px;">Entre ton code personnel.</p>

      <div class="field">
        <label>Code</label>
        <div class="pw-wrap">
          <input type="password" id="code-input" autofocus required />
          <button type="button" class="pw-toggle" id="code-toggle" aria-label="Afficher le code"></button>
        </div>
      </div>

      <p class="error-text" id="error-text" style="display:none;"></p>

      <button type="submit" class="btn" style="width:100%; margin-top:8px;">Entrer</button>

      <p class="hint-text" style="margin-top:16px;">
        Tu es Léona ? <a href="moi.html" style="color:var(--persimmon);">Connexion admin</a>
      </p>
    </form>
  </main>

  <script type="module">
    import { checkPersonCode, setPerson } from './assets/js/auth.js';
    import { icon } from './assets/js/icons.js';

    const codeInput = document.getElementById('code-input');
    const codeToggle = document.getElementById('code-toggle');
    codeToggle.innerHTML = icon('eye', 18);
    codeToggle.addEventListener('click', () => {
      const showing = codeInput.type === 'text';
      codeInput.type = showing ? 'password' : 'text';
      codeToggle.innerHTML = icon(showing ? 'eye' : 'eyeOff', 18);
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = codeInput.value;
      const errorText = document.getElementById('error-text');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      submitBtn.disabled = true;
      const person = await checkPersonCode(code);
      submitBtn.disabled = false;

      if (person) {
        setPerson(person);
        // replace() plutôt que href : évite de garder acceder.html dans
        // l'historique, sinon un swipe-back (iOS, en PWA installée) y
        // ramène l'utilisateur au lieu de rester sur cercle.html.
        window.location.replace('cercle.html');
      } else {
        errorText.textContent = 'Code incorrect.';
        errorText.style.display = 'block';
      }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
