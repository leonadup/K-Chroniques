<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Les K-Chroniques de Léona — Accès</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="assets/icons/favicon-32.png" />
  <meta name="theme-color" content="#c1502b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
  <main class="fds-login-wrap">
    <form class="fds-login-card" id="login-form">
      <h1 style="font-size:22px; margin-bottom:6px;">Les K-Chroniques de Léona</h1>
      <p style="font-size:13px; color:var(--ink-soft); margin-bottom:20px;">Entre ton code personnel.</p>

      <div class="field">
        <label>Code</label>
        <input type="password" id="code-input" autofocus required />
      </div>

      <p class="error-text" id="error-text" style="display:none;"></p>

      <button type="submit" class="btn" style="width:100%; margin-top:8px;">Entrer</button>

      <p class="hint-text" style="margin-top:16px;">
        Tu es Léona ? <a href="moi.html" style="color:var(--persimmon);">Connexion admin</a>
      </p>
    </form>
  </main>

  <script type="module">
    import { checkPersonCode, setPerson } from './assets/js/auth.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code-input').value;
      const errorText = document.getElementById('error-text');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      submitBtn.disabled = true;
      const person = await checkPersonCode(code);
      submitBtn.disabled = false;

      if (person) {
        setPerson(person);
        window.location.href = 'cercle.html';
      } else {
        errorText.textContent = 'Code incorrect.';
        errorText.style.display = 'block';
      }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
